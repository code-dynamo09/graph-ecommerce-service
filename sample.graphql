
query GetAllCategories {
    getAllCategories {
        id
        name
        slug
    }
}

query ViewProduct($productId: ID!) {
    viewProductCatalog(id: $productId) {
        id
        sku
        name
        price
        averageRating
        category {
            name
        }
        inventory {
            availableStock
            warehouseLocation
        }
    }
}

