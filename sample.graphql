query Search($filter: ProductFilterInput!, $limit: Int, $offset: Int) {
    searchProducts(filter: $filter, limit: $limit, offset: $offset) {
        pageInfo {
            totalCount
            hasNextPage
        }
        edges {
            cursor
            node {
                id
                name
                price
            }
        }
    }
}


