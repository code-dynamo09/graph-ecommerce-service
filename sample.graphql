mutation AddToCart($customerId: ID!, $itemInput: CartItemInput!) {
    addItemToCart(customerId: $customerId, item: $itemInput) {
        customerId
        cartSubtotal
        items {
            quantity
            product {
                name
                price
            }
        }
    }
}

