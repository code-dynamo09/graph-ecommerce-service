mutation Checkout($customerId: ID!, $paymentType: PaymentType!) {
    processCheckout(customerId: $customerId, paymentMethod: $paymentType) {
        orderNumber
        status
        placedAt
        financials {
            subTotal
            grandTotal
        }
        paymentDetails {
            transactionToken
            amount

            # Use fragments to handle the Polymorphic Interface
            ... on CreditCardPayment {
                cardBrand
                maskedPan
            }
            ... on WalletPayment {
                walletProvider
            }
        }
    }
}

